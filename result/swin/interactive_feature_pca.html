sverse US image of the left ovary demonstrates the \u201cstring of pearls\u201d sign.",18.269935607910156],["Neck CT showing a left lymph node conglomerate with hypodense images due to necrotic changes, loss of cleavage plane with muscle structures, and mass effect on the ipsilateral jugular vein.CT: computed tomography",16.40234375],["Postoperative computed tomography angiography showing that the left internal mammary artery graft was patent, with good distal run-off in the left anterior descending artery.",17.77609634399414],["DSA showing self-expandable stent of the left ICA.Foot note: DSA, Digital Subtraction Angiography; ICA, Internal Carotid Artery.",17.447832107543945],["Abdominal X-ray. SEMS was placed beyond the stenosis.",23.12520980834961],["HRCT done on presentation to the ER that shows B\u002fL ground glass infiltrates with patchy consolidations involving mainly the peripheries",20.593746185302734],["Computed tomography of the head: coronal view showing the effacement of the left lateral ventricle frontal horn and 5-mm left to right midline shift (yellow arrow) secondary to intraparenchymal hemorrhage (red arrow)",17.541845321655273],[" Computed tomography of the head showing large intraparenchymal hemorrhage of the left anterior temporal lobe and left inferior frontal lobe (arrows) with surrounding edema and mass effect.",18.59507179260254],[" Retroperitoneal mass detected on enhanced abdominal computed tomography. The yellow arrow indicates the tumor was closely related to the liver.",16.221458435058594],["Brain MRI axial FLAIR showing hyperintensities in the anterior temporal lobe bilaterally. FLAIR:\u00a0fluid-attenuated inversion recovery",17.540742874145508],["Brain MRI coronal T2 showing hyperintensity in the right anterior temporal lobe",16.27855682373047],["Longitudinal long-axis transthoracic echography after an uneventful vegetation excision, partial leaflet resection, and reconstruction by pericardial patch and ring annuloplasty (the latter is indicated by the arrow). Traces of colour Doppler flow in the left atrium indicates severe mitral regurgitation resolution after surgery. Anatomical landmarks: AA, ascending aorta; LA, left atrium; LV, left ventricle; RV, right ventricle.",17.3043270111084],["The whole body F18-FDG PET\u002fCT tomography scan (July 31, 2009) showing multiple enlarged lymph nodes on left supraclavicular area. F18-FDG-PET\u002fCT\u200a=\u200aFluorine 18 fluorodeoxyglucose- Positron emission tomography\u002fcomputed tomography.",16.23998260498047],["Disappearance of FDG accumulation during the subsequent patient follow-up.",23.511825561523438],[" The typical chest X-ray finding of a patient with coronavirus disease 2019 infection showing bilateral infiltration.",18.050119400024414],["Coronal view of the lesion within the left adnexa, which contains a thin septation measuring 4.3\u2009cm and adjacent free fluid extending to the posterior cul-de-sac and a homogeneously enlarged liver.",18.871240615844727],["Computed tomography image of the abdomen showing adrenal mass on axial plane. Image showing heterogenous 7.7\u00a0cm lesion (white line measure) appearing to be arising from left adrenal glands in contact with the upper pole of left kidney with areas of hypodensity suggesting necrosis.\u00a0",13.561971664428711],["Postoperative panoramic radiograph at one-year follow-up showing the management of high caries risk patient.",19.699951171875],["Plain radiograph of the pelvis shows deformation of the left femoral head, narrowing of hip space, and osteophyte hyperplasia.",17.93872833251953],["Operative planning ultrasound prior to ultrasound-guided subcutaneous collection drainage and appendicolith retrieval. The red arrow indicates the hypoechoic collection with some internal echoes overlying to the abdominal wall (green arrow), with internal appendicoliths (white arrows). The collection measured 34\u2009mm deep to the skin.",17.895450592041016],["Chest CT scan of a novel false-negative PC patient. A 44-year-old nonsmoking female with a ground-glass opacity in the left lower lung showed false-negative CrAg LFA detection in the lung aspirate after CT-guided percutaneous lung biopsy. No suitable pathological tissue was obtained and the patient eventually underwent thoracoscopic surgery and was diagnosed with PC. CrAg = cryptococcal capsular polysaccharide antigen, CT = computed tomography, LFA = lateral flow immunoassay, PC = pulmonary cryptococcosis.",18.118202209472656],["Representative case with pulmonary cryptococcosis showed a nodule accompanied by pleural stretch signs, positive for CrAg in the lung aspirate, but negative in the serum. The patient was confirmed to have PC by histopathological examination. CrAg = cryptococcal capsular polysaccharide antigen, PC = pulmonary cryptococcosis.",18.142728805541992],["MRI in T2 weighted sequence with unclear vascularised structure (arrow) at the hepatic hilus with signal change.",18.043296813964844],["Anterior-posterior tibia-fibular intra-operative radiographs of irrigation and debridement with concomitant flexible nailing of the tibial shaft.",17.72768783569336],["One-month post-operative lateral tibia-fibula radiographs of flexible nailing of the tibia.",18.238929748535156],["T1-weighted MRI image. The image shows a hyperintense focus in the white matter of the right occipital lobe, representing a tiny hemorrhage (white arrow).",17.256710052490234],["A CT scan of the chest The scan shows a small cavitary nodule in the anterior segment of the left upper lobe (white arrow).",18.9637451171875],["Abdominal CT scan\u00a0The scan shows a small septated cystic lesion in segment 8\u002f1 of the liver (white arrow).",15.64693546295166],["A CT scan of the chest. The scan shows a small sub-pleural nodule-like consolidation (white arrow).\u00a0",16.518457412719727],["CT scan of the maxillofacial area without contrast showing lytic lesion of the right mandible.",18.44083595275879],["Preoperative radiograph of a female 35-year-old patient with left hip dislocation and fracture of the femoral head (Pipkin type 1 fracture)",19.700281143188477],["Angiographic image showing left main coronary artery (LMCA) dividing into circumflex (Cx) and left anterior descending artery (LAD). LAD is seen only up to the first part and then the diagonal branch is seen with 90% stenosis. Circumflex is seen with 80% to 90% stenosis.",21.67547035217285],["Cone-beam computed tomography scan showing radiopaque nonhomogeneous mass with calcification flecks on the lingual aspect of the right bicuspid region (arrow).",18.266447067260742],["Ultrasound guided peripheral nerve block for the lateral antebrachial cutaneous nerve at the elbow. BrM: brachialis muscle, BT: biceps tendon, CV: cephalic vein, ECRL: extensor carpi radialis longus muscle, H: humerus, RN: radial nerve.",20.246826171875],[" A 69-year-old man presented with obstructive jaundice due to recurrence 18 mo after distal gastrectomy and Roux-en-Y reconstruction for gastric cancer. A recurrent mass with central necrosis (white arrowheads) obstructed the extrahepatic bile duct (black arrow), causing dilatation of intrahepatic bile ducts and gallbladder (white arrows). While endoscopic ultrasound-guided hepaticogastrostomy led to symptomatic relief, the patient died 1 mo later.",15.65049934387207],["Chest radiograph during initial presentation demonstrating complete opacification of the right hemithorax with mediastinal shift to the opposite side.",16.85725212097168],["Radiography after PMMA bone cement filling following allograft chip bone filling in the subchondral region after curettage. The arrow indicates the allograft chip bone",18.955860137939453],["Preoperative anteroposterior pelvic X-ray of a 31-year-old female shows narrowing of joint space and cortical erosions and lucency in the acetabulum and femoral head of the right hip.",18.782968521118164],["Postoperative chest x-ray demonstrating resolution of the pneumopericardium",16.484312057495117],["Axial CT pelvis showing enlarged prostate (9.6cm) (red arrow) with a mass effect on the rectum and bladder",16.15726661682129],["T2-weighted MRI (T2WI).Image showing a well-defined lesion in the right parotid gland with a central homogeneous hyperintense component (*) suggestive of a cyst. Note the heterogeneous peripheral solid component with a few smaller microcysts within.",17.809846878051758],["T1 VIBE fat-saturated image.In a post-gadolinium image, the peripheral solid component enhances, surrounding the central non-enhancing hypointense cystic component (*). A smaller cyst (arrow) is also noted within the peripheral solid component. Note the normal mastoid segment of the right facial canal (dotted arrow) in relation to the parotid lesion.",17.58901596069336],["Fluoroscopic image showing strut grafts in place across the metatarsal phalangeal joint.",19.72887420654297],["Ultrasonographic image of the lumbar vertebra of a dog in the transverse midline plane: 1\u2014iliocostalis and longissimus muscles; 2\u2014spinalis and semispinalis muscle; 3\u2014multifidus muscle; SP\u2014spinal process; AP\u2014articular process; VL\u2014vertebral lamina; TP\u2014transverse process; F\u2014floor of the vertebral canal.",16.418689727783203],["Axial CT image of the posterior fossa in bone window setting displays a\u00a0sprinkled, sand-like calcification within the lesion (arrowhead)",19.252809524536133],["X-ray of the pelvis demonstrated a large lytic bubbly lesion (solid white arrows) within the left iliac wing extending to involve the left acetabulum but sparing the left femur demonstrating a lobulated sclerotic superior border and ill defined inferior, medial and lateral borders suggestive of a bony metastasis in the context of a malignant thyroid mass.",16.87725067138672],["Axial T1-weighted post-contrast MRIThe image demonstrates non-enhancing expansile lesions in the right greater than left thalami.",15.028290748596191],["Oedema around the symphysis, spreading cranially, dorsally and caudally",17.43372917175293],["Coronal CT pelvis with contrast demonstrating osteomyelitis of the right ischial tuberosity",17.397991180419922],["T2 head and neck MRI in sagittal view showing isointense mass in the submandibular region suggesting ectopic thymus (red arrow).",19.972007751464844],["A 5-year-old child with multiple epiphyseal dysplasia, autosomal dominant type. Radiographs show delayed, disorganized epiphyseal ossification including small and round capital femoral epiphyses and irregular epiphyseal ossification of the knee",18.180295944213867],["A 2-month-old infant with infantile cortical hyperostosis (Caffey disease). Radiograph shows cortical hyperostosis in the left femur and right tibia",17.7537841796875],["CT pulmonary angiogram showing large pockets of gas within the right breast parenchyma (blue arrows) with edema of the overlying skin. CT: computed tomography",20.234539031982422],["Ultrasonography picture of the RF.",17.39013671875],["Chest radiograph (P-A view) showing consolidation on the left upper and lower lobes and right upper lobe",19.283061981201172],["Thoracic computed tomography scan revealing obstruction of the right lower bronchus by a contrast-enhanced intraluminal lesion of 2.5 cm in diameter.",17.482120513916016],["Abdominal CT-scan revealing right renal atrophy with nonspecific ureteral and pyelocaliceal ectasia and retroperitoneal fibrosis involving the right ureter",15.488375663757324],["Axial CT scan without contrast enhancement. Red arrows show two spots of unilateral typical deep cortical venous hemorrhages with minor surrounding oedema in the left frontal lobe of the brain. The frontal hemorrhage spot crosses the borders of arterial brain vascular territories.",18.053773880004883],["Arteriography of the arteriovenous fistula on the right tibial posterior artery.",17.93903160095215],["X-ray image of aseptic loosening of the distal stem of the humeral intercalary endoprosthesis. Resection of the metastasis revealed it was a uterine sarcoma solitary metastatic lesion of the left humerus. After 23 months, there was aseptic loosening. Due to the patient\u2019s poor general condition (pulmonary and multiple skeletal metastases) and acceptable functional result (a Musculoskeletal Tumor Society score of 21), revision was not indicated. This image is from patient 7 in Table 1.",17.287036895751953],["Transthoracic echocardiogram showing a giant mass (white arrow) in the left atrium obstructing the mitral valve (yellow arrow) that is suggestive of myxoma",15.675491333007812],["Post\u2010removal panoramic image of the odontoma with the subsequent alignment of the impacted teeth",19.05387306213379],["Native mitral valve with mild annular and leaflet calcification. (A) Left ventricle and (B) atrium. Arrow shows the mitral valve.",16.611125946044922],["Axial cardiac computed tomography angiography demonstrating the left ventricular pseudoaneurysm inferior to the mitral annular plane with layered thrombus. (A) Pseudoaneurysm and (B) thrombus.",18.707185745239258],["Target and avoidance structures. Example axial slice representing the method used for contouring target and avoidance structures. Red: old GTV; inner magenta: CTV1; inner yellow: PTV1 (mod); outer magenta: CTV2; outer yellow: PTV2",18.72220802307129],["Femur x-ray showing the distal displaced femoral fracture (view 1)",17.249879837036133],["Femur x-ray showing the distal displaced femoral fracture (view 2)",18.139291763305664],["Radiographic imaging of chest taken on second day of admission when the patient developed shortness of breath, showing heterogeneous opacity over the lower right zone",16.850833892822266],["Abdominal ultrasound (orange arrow) highlighting moderate ascites in the right upper abdominal quadrant.",15.420114517211914],["Ultrasound image of the left thyroid area during US-FNABAn ultrasound examination during US-FNAB revealed a hypoechoic cystic lesion (red arrow) in the left thyroid. The margins were smooth and well-defined. A few echogenic granules were observed in the capsule. An FNAB was then performed with two needle passes of a 21-gauge needle. A hypoechoic solid lesion (white star) corresponding to the site of the left parathyroid was also identified but not biopsied.US-FNAB - ultrasound-guided fine-needle aspiration biopsy",17.455509185791016],["TEE showing 7-mm presumed fibroelastoma present on the aortic valve (yellow arrow)TEE:\u00a0transesophageal echocardiogram",17.106557846069336],["Cephalometric landmarks: sella (S), nasion (N), point A, pronasale (tip of nose, Prn), subnasale (Sn), labrale superius (Ls), anterior nasal spine (ANS), and incisor superius (Is). The X-axis (horizontal line) was constructed by drawing a line through N and 7\u00b0 above the NS line, and the Y-axis (vertical line) passed through S and was perpendicular to the X-axis. The following distances and angles were measured: red line: ANS\u2013Prn, ANS\u2013Sn, ANS\u2013Ls; green line: Is\u2013Sn, Is\u2013Ls, Ls-Sn; white dotted line: nasolabial (NLA) angle.",19.543357849121094],["Brain mri T2 sequence showed a large cyst arachnoid compressing the brainstem and the 4th ventricle.",19.1650333404541],["CT scan of the abdomen showing hepatosplenomegaly with post\u2010surgical changes",13.697047233581543],[" Axial plane of CT-PNS image showing, soft tissue density lesion completely occluding right maxillary sinus, extending anteriorly into the right nasal cavity through the widened ostium with mass effect on the nasal septum resulting in deviated nasal septum with convexity toward the left side and atrophy of the corresponding middle turbinate due to compression. The absence of medial wall of the right maxillary sinus with thinning of the medial pterygoid plate on the right side suggestive of bony involvement.PNS -\u00a0paranasal sinuses",17.415592193603516],["Radiograph of the left hip after surgery.",18.715105056762695],["Chest radiograph of the second right-sided pneumothorax more extensive involving the right upper lobe (black arrow).",18.054359436035156],["Last chest radiograph performed, showing almost complete resolution of the second pneumothorax after second blood patch.",18.97624397277832],["Micro-CT slice through a pheasant carcass.This shows a whole shotgun pellet, a small metal fragment and a probable bone fragment. Note the obvious blooming artefact effect around the shotgun pellet.",17.680814743041992],["Ultrasound of the left axillary area showed a solid mass with two small cystic degenerations, which were highly suspected to be a few liquefied abnormal structures in the lymph nodes.",16.255659103393555],["A mediastinal window with 16-slice spiral CT showed that the left axilla had a slightly circular and low-density shadow, with a cross-sectional area of approximately 33\u00a0mm \u00d7 47\u00a0mm and a CT value of approximately 33 HU. The mass was closely related to the chest wall, with a slender pedicle faintly visible.",17.792484283447266],["Abdominal CT showing a cystic lesion with some calcification in the right iliac fossa (arrow).",18.127105712890625],["Coronal magnetic resonance imaging with gadolinium contrast of the skull base. The arrow points to right skull base with enhancing lesion.",16.26199722290039],["Transverse view of the ultrasound-guided fine needle aspiration of the left thyroid lobe. The arrows are pointing to the fine needle.",18.510887145996094],["Sagittal MRI view of the spine (T2-weighted) with a hypersignal in the L2L3 and L5S1 disc spaces",19.84722328186035],["Chest CT after lung surgery and after two cycles of postoperative treatment. The right pleural effusion decreased significantly.",18.819042205810547],["Sagittal MRI showing enhancements (white arrows) in the periventricular and dorsal pontine regions.MRI: magnetic resonance imaging",16.54764747619629],["Sagittal MRI showing periventricular enhancement with radiations (white arrows) perpendicular to the body of the lateral ventricle (Dawson\u2019s fingers).MRI: magnetic resonance imaging",16.17798614501953],["CT of the thoracic cavity revealed a mass measuring 27\u2009\u00d7\u200923 cm in the caudal lobe of the right lung",19.525480270385742],["A panoramic radiographic view of the TMJ showed a normal shape in both condyles. R: right. L: left.",20.304868698120117],["Transverse view: Superior slice showing enhancement in the middle cranial fossa of the anterior right temporal lobe.",16.677156448364258],["Dividing into two zones along the long axis of the hematoma, each zone was assumed to be an imaginary sphere.",17.69776725769043],["The good position (A) is the case that the tube is 1cm deeper from the margin of the hematoma, and the case where the tube is located outside is called the poor position (B).",16.917720794677734],["Chest CT showing an inhomogeneous alteration of the left thyroid lobe, corresponding to the metastatic thyroid involvement from the ACC.",17.562841415405273],["Abdominal CT.Red arrow pointing at the 9-cm\u00a0retroperitoneal mass. Blue arrow pointing to the liver on the left side of the abdomen consistent with the patient's abdominal heterotaxy",19.87946319580078],["Repeat thoracic CT.CT chest showing innumerable lung lesions, which is worse than the previous studies raising concern for progressive metastatic disease",18.371721267700195],["Magnetic resonance imaging: T1 coronal slice showing a well-circumscribed mass, both solid and cystic components of the lesion in the subcutaneous plane of the medial popliteal fossa can be seen. No invasion of soft tissue, joint space, or bone.",15.272473335266113],["CT scan of the chest.CT scan of the chest showing scattered reticular, ground-glass, atelectatic and fibrotic changes again seen in both lungs. These are slightly worsened compared to Figure 1 especially in the right upper lobe where there is a groundglass patchy infiltrate of 5 cm in size with associated new cavity of 2 cm in the right middle lobe (blue arrow).\u00a0",20.533893585205078],["Infection with human immunodeficiency virus (HIV) is the strongest known risk factor for active tuberculosis (TB), and the risk of developing active TB in people living with HIV (PLWH) is 15\u201322 times higher than in people without HIV [1]. Active TB may develop at any stage of HIV infection, but the risk correlates negatively with CD4+ cells count. TB is the leading cause of morbidity, hospitalisations, and mortality in PLWH [1]. There were 214,000 deaths due to TB among HIV-positive people in 2020 worldwide, which accounted for 31.5% of all HIV-related deaths [1,2]. Therefore, it is recommended to screen for TB in HIV-positive patients, and for HIV infection in newly diagnosed TB patients [3,4,5]. Around 16% of all PLWH do not know that they are infected with HIV [1], and about 25% of incident HIV patients present to care with advanced disease [3]. Immunosuppression caused by HIV infection affects clinical and radiologic presentation of TB. Atypical TB presentation is often observed in the late stages of HIV infection [6,7,8,9]. Such atypical TB presentation in a person with HIV infection not yet diagnosed, may be challenging, as described below. A 42-year-old woman of Indian origin was referred to a respiratory medicine department after her chest X-ray (Figure 1) revealed nodular opacifications in the lungs and bilateral pleural effusion (arrows). The patient had a 4-month history of unspecific chest and feet pains, mild dry cough, fatigue, reduced appetite, and body weight loss of 6 kg. She denied dyspnoea, sputum expectoration, haemoptysis, night sweats, or fever. On admission to the hospital, she was in good condition, her vital signs were normal, BMI was 19.2. There was no palpable peripheral lymphadenopathy or oedema; the vesicular breathing sound was reduced bibasiliary on chest auscultation. Blood tests showed elevated CRP\u2014109.4 (N:\u003c5) mg\u002fL and ERS\u2014120 (N: \u003c 12), normal procalcitonin, normal leukocyte and neutrophil counts, decreased lymphocyte count\u20140.84 \u00d7 103 (N:1.18 \u00d7 103\u20133.74 \u00d7 103) cells\u002fmm3.",17.497201919555664],["Computed tomography of the chest showing the large bilateral pleural based nodularities",16.707290649414062],["MRI brain. White arrow:\u00a0axial T2 flair showing T2 hyperintensity of the mammillary bodies bilaterally\u00a0",15.289995193481445],["The blue arrow indicates the socket from which the third molar was extracted. The presence of air around the right parapharyngeal space in the mandible level (indicated by yellow arrows) was confirmed by computed tomography.",16.865596771240234],["FLAIR MRI medial thalamic hyperintensities. FLAIR MRI of the brain shows vague bilateral hyperintensities in both medial thalami (arrow).",16.511524200439453],["Coronal slice through the posterior end of the cribriform plate. Unpneumatized (arrowheads) nasal roof (type I).",20.62263298034668],["CT scan of the pelvis findings.",15.235576629638672],["Sagittal CT scan of the left femoral acetabular joint.",18.367876052856445],["Axial CT scan of the left hip and femoral acetabular joint.",18.445186614990234],["Endoscopic ultrasound showing a 13 \u00d7 10\u00a0mm solid lesion in the pancreatic remnant.",19.456857681274414],["Parasternal long-axis view showing the A2 and P2 mitral scallops.",16.550046920776367],["Parasternal short-axis view showing the posteromedial (PM) and anterolateral (AL) commissures and the mitral scallops.",15.807581901550293],["MRI of a typical residual mass resulting from chemotherapy of left-sided metastatic seminoma: 5 cm para-aortic mass (patient R8 in  Table\u00a01 ). T1-weighted imaging, fat-suppressed mode, coronal section. AA, abdominal aorta; IVC, inferior vena cava; LRV, left renal vein. Arrows denote the residual mass. This patient had an M371 level of relative quantity (RQ) = 1 and is continuously disease-free for 24 months. This figure illustrates that neither the imaging technique (i.e., MRI) nor the size of the residual mass (5 cm in this case) can safely predict the histology of the residual mass.",17.927766799926758],["Sagittal view of the retroperitoneal mass",19.728776931762695],[" Axial view of the retroperitoneal mass",15.75354290008545],["Selective angiography representing a long-standing obstruction of the SMA with well-developed collaterals through the GDA (CA: yellow arrow, GDA: blue arrow, and SMA: red arrow) (from the Department of Radiology and Nuclear Medicine, University Hospital of Magdeburg [Germany]). SMA, superior mesenteric artery.",19.615968704223633],["Minimal or no contrast on the film seen after maximal contrast injection.",17.682044982910156],["CT scan of the chest demonstrating diffuse ground-glass opacities in the upper lung fields and near-complete opacification of the lower lobes bilaterally with multifocal areas of cystic necrosis and cavitary lesions.",17.475982666015625],["Abdominopelvic scan showing a pelvic-abdominal injury, tissue necrosis in places, slightly hand colored by the injection of contrast.",18.006467819213867],["Bilateral ground glass opacities with fuzzy edge in the lower lobes in a 35-year old woman (mild group).",17.559167861938477],["Magnetic resonance imaging with contrast revealed filling defect of the superior sagittal sinus (white arrow) that confirm the diagnosis of cerebral venous sinus thrombosis. A, anterior; P, posterior; H, head; F, foot.",16.31941032409668],["Sagittal view of the mycotic abdominal aneurysm",18.85944175720215],["Erector Spinae Plane Block. ESM\u2009=\u2009erector spinae muscle; LA\u2009=\u2009site of local anesthetic; NS\u2009=\u2009needle shaft; RM\u2009=\u2009rhomboid muscle; T4\u2009=\u2009transverse process of the fourth thoracic vertebra; TM\u2009=\u2009trapezius muscle",17.479345321655273],["Axial view of the maximum thickness of the left gluteus minimus and medius muscles on CT. The right side is about three times thicker than the left side with respect to the gluteus minimus (*) and the gluteus medius (#).",15.739070892333984],["Cardiovascular magnetic resonance imaging late gadolinium imaging (phase-sensitive inversion recovery), short-axis, demonstrating global uptake of the pericardium. There was no enhancement of the myocardium.",22.095928192138672],["Sagittal balance parameters of cervical spine. SVA, sagittal vertical axis; CGH, center of gravity of the head.",18.437530517578125],["PET-CT demonstrates the tumor intensely increased FDG uptake with bony metastases (arrowhead).",16.72345542907715],["T2-FLAIR hyperintensities in the periaqueductal gray, medial thalamus, and mamillary bodies that were consistent with non-alcoholic Wernicke encephalopathy.FLAIR: fluid-attenuated inversion recovery",15.861970901489258],["CT of the chest: Interstitial lung disease with bronchiectasis",14.944682121276855],["Orthopantomogram showing the mandibular radiolucent area.",19.608333587646484],["The 2D sonographic image of the fetal chest (horizontal section)Congenital diaphragmatic hernia with herniation of the stomach (S) more than halfway past the mid-line (dotted line). The heart (arrows) was shifted into the right thoracic cavity. The right lung was compressed and shrinking (arrowheads).",16.560089111328125],[" The 2D sonographic image of the fetal head (horizontal section)Mild enlarged atrial width (caliper, 11mm) is shown",18.111242294311523],["HRCT scan\u2014Emphysema\u2014the white arrow indicates the emphysematous changes in the lung.",15.527185440063477],["Basal choline PET\u002fTC at the beginning of MA treatment reveals progressing mediastinal nodal metastases.",19.160350799560547],[" Sagittal fat-suppressed proton density-weighted magnetic resonance imaging shows a left transverse patellar fracture (arrow) after the dislocation occurred at physical therapy.",19.119789123535156],[" Axial fat-suppressed proton density-weighted magnetic resonance imaging (MRI) shows trochlear dysplasia and the measurements taken for determining the trochlear depth ([59 + 58.1] \u00f7 2) \u2013 56.5 = 2.05 mm. An axial MRI 3 cm above the joint line is needed to calculate the trochlear depth. The average distance of the medial and lateral facets from a line tangential to the femoral condyles is subtracted from the distance of the trochlear groove to that same tangential line. A value \u003c3 mm is considered shallow and consistent with trochlear dysplasia.",17.5990047454834],["CT of the lungs demonstrates bilateral mid- and lower lung patchy consolidations and ground-glass opacities extending into the bilateral lung bases. Bilateral air bronchograms are noted.",18.07075309753418],["Injection of fluid in between the tibial (T) and peroneal (P) nerve.",15.197566986083984],["Computed tomography (CT) of the abdomen revealing changes consistent with cirrhosis and splenomegaly.",15.982038497924805],["Defect of alveolus and nose at the age of 40 (CT scan).",17.15714454650879],["Coils were placed in the fistula, achieving shunt occlusion with coil embolization.",21.485963821411133],["Transesophageal echocardiogram with a mid-position view displaying a vegetation (white arrows) on the mitral annulus with extension to the anterior and posterior mitral leaflets and perforation of the anterior mitral leaflet (red arrow)",17.865556716918945],["Preoperative computed tomography scan showed a unilateral absence of the left pulmonary artery.",19.887344360351562],["Preoperative thoracic digital radiography image showing that the transverse diameter of the trachea was 33\u2005mm on the level of 2\u2005cm above the aortic arch.",16.6912784576416],["Computed tomography scan showed neoplastic invasion of the entire thoracic aorta.",17.163143157958984],["Maintaining the integrity of the femoral isthmus is mandatory; a minimal contact of 2 cm is necessary for primary stability of the stem.",17.908029556274414],["MRI showing resolution of the effusion.",16.89341163635254],["Measurement of RTA and RTD on AP pelvis radiograph. RTD is the perpendicular distance between Line a and Line b. The angle between the Line b and Line c forms the RTA.",18.860441207885742],["Reconstructed micro-computed tomography image for measuring the distance between the incisive canal and the apex of the mesial root of the first molar (red arrow).",16.744060516357422],["An abdominal CT scan revealed a 2\u00a0cm mass with mild contrast effect in the pancreatic body. There was a little tendency to invade the surrounding area, which was different from typical pancreatic ductal carcinoma.",16.556474685668945],["Osteolysis in synovial fold zone of the atlantoaxial articulation in CT scan",17.78614616394043],["Chest X-Ray with abdominal shield suggestive of bilateral inhomogeneous infiltrates and a thick-walled cavity with air-fluid level in the lower zone of the right lung field.",14.856986045837402],["Dorsoventral thoracic radiograph showing a discrete soft tissue nodule in the right caudal lung lobe visible between the 9th and 10th ribs; this nodule is not, however, clearly identifiable on the lateral views",15.267583847045898],["Mid-esophageal view of Transesophageal echocardiogram showing flail P2 portion of the mitral valve.LA: Left atrium,\u00a0LV: Left ventricle",18.803211212158203],["Measurement example for a patient with high-grade extracranial ICA stenosis on the right side. SI (signal inentsity) ratio\u2009=\u2009mean SI-contralesional:mean SI-lesional\u2009=\u2009233.77:181.38\u2009=\u20091.289",20.19489288330078],["Coronal CT image, the largest diameter of the caecum is 10 cm, intestinal pneumatosis is indicated by 1 arrow.",18.072303771972656],["CT showing a foreign object in the frontal sinus.Parasagittal CT of the paranasal sinuses on bone window showing 9.5\u00a0mm wide foreign object (air pellet) in the inferior aspect of the frontal sinus.",16.743005752563477],["Lateral projection of skeletally mature feline patient demonstrating the cardiac landmarks for vertebral heart scale (VHS) measurements as described by Buchanan.",17.115991592407227],["Philips EPIQ, linear transductor, B-mode, frequency 5\u201312\u00a0MHz, right lower abdomen quadrant, cranial kidney: with a highly detailed linear probe it is possible to appreciate in the cranial kidney, recognizable for the pelvic dilatation, the presence of microcystic anechoic dilatations in papillary zone (signed by yellow arrowheads) and multiple diffuse hyperechoic spots (calcifications, signed by yellow arrows)",18.896881103515625],["Sagittal computed tomography scan reconstruction of the upper airway.",16.440217971801758],["Radiography findings 13\u00a0months after the operation. Radiograph revealed absence of loosening of the left hemiarthroplasty and heterotopic ossification of the left hip joint, and bone fusion was obtained in the right trochanteric fracture",21.299522399902344],["Endoscopic ultrasound showing fistulous tract to the stomach.",15.784314155578613],["Axial CT angiography of the abdomen with contrast showing aortic dissection",14.852544784545898],["CT scan showing T6 osteolytic lesion (red arrow), calcified fibroid on the uterus (yellow arrow), and intrauterine device in place (blue arrow).",18.179906845092773],["The PET-CT examination shows accumulation of the metabolic tracer of a diffuse character due to pulmonary thickening, with ground glass. Concomitant further accumulation of the tracer is found in some lymph nodes in the intercavo-aortic area, inter-portocaval and hepatic hilum. Limited to the resolution capacity of the method (4 mm) no further pathological areas are highlighted accumulation of the radiopharmaceutical in the remaining areas of the body examined.",16.8385009765625],["Contrast extravasation in the sigmoid colon (Arrow).",17.34418296813965]],"hovertemplate":"ID: %{text}\u003cbr\u003eCaption: %{customdata[0]}\u003cbr\u003eFeature norm: %{customdata[1]:.3f}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"opacity":0.75,"size":7},"mode":"markers","name":"the","text":["ROCOv2_2023_test_000003","ROC
